<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A growing collection of little tools." />
  <title>little tools i wanted to exist</title>
  <style>
    :root {
      --bg: #fffefb;
      --panel: #f3f5dc;
      --panel-soft: #eef2d8;
      --border: #dde3bf;
      --text: #26311f;
      --muted: #7b836f;
      --accent: #8d9f57;
      --accent-soft: #eef2d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      width: min(1080px, calc(100% - 34px));
      margin: 0 auto;
      padding: 76px 0 54px;
    }

    .hero {
      max-width: 820px;
      margin: 0 auto 46px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -.035em;
      text-transform: lowercase;
    }

    .subheading {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: lowercase;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
    }

    .search {
      flex: 1;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #f7f8e8;
    }

    .search span {
      color: var(--accent);
      font-size: 18px;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .search input::placeholder { color: #9aa18f; }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      aspect-ratio: 1 / 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }

    .card.clickable { cursor: pointer; }

    .card.clickable:hover {
      transform: translateY(-2px);
      border-color: #c8d195;
      background: #f8f9ea;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      font-size: 22px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .status.live {
      color: #7f9951;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #8fb15c;
    }

    .card h2 {
      margin: 20px 0 8px;
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .description {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .card-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: #fcfdf7;
      font-size: 11px;
      font-weight: 800;
    }

    .open {
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .empty {
      display: none;
      padding: 34px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 22px;
      color: var(--muted);
    }

    footer {
      margin-top: 34px;
      text-align: center;
      color: #9aa18f;
      font-size: 12px;
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 650px) {
      .shell {
        width: min(100% - 22px, 1080px);
        padding-top: 48px;
      }

      .hero { margin-bottom: 34px; }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .count { padding-left: 2px; }

      .grid { grid-template-columns: 1fr; }

      .card {
        aspect-ratio: auto;
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>little tools i wanted to exist</h1>
      <div class="subheading">a growing collection</div>
    </section>

    <section class="toolbar" aria-label="Tool filters">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="search tools…" autocomplete="off" />
      </label>
      <div class="count" id="toolCount"></div>
    </section>

    <section class="grid" id="toolGrid"></section>
    <div class="empty" id="emptyState">no tools match that search</div>

    <footer>a simple home for whatever comes next</footer>
  </main>

  <script>
    /*
      ADD OR EDIT TOOLS HERE.
      Leave url as "" until a tool has a live URL.
    */
    const TOOLS = [
      {
        name: "Accounting Account Trainer",
        description: "Practice account types, financial statements, and normal debit or credit balances. For ACCTG 001",
        icon: "∑",
        tags: ["Accounting", "Study", "Quiz"],
        url: "https://accounting-quizzer.stricker1392.workers.dev/"
      },
      {
        name: "Class Scheduler",
        description: "Build customizable class schedules, inspired by UCR's registration system",
        icon: "▦",
        tags: ["Classes", "Planning", "Schedule"],
        url: "https://class-scheduler.stricker1392.workers.dev/"
      }
    ];

    const toolGrid = document.getElementById("toolGrid");
    const searchInput = document.getElementById("searchInput");
    const toolCount = document.getElementById("toolCount");
    const emptyState = document.getElementById("emptyState");

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cardMarkup(tool) {
      const hasUrl = Boolean(tool.url);
      const wrapperTag = hasUrl ? "a" : "article";
      const href = hasUrl ? ` href="${escapeHTML(tool.url)}" target="_blank" rel="noopener noreferrer"` : "";
      const className = hasUrl ? "card clickable" : "card";
      const status = hasUrl
        ? `<span class="status live"><span class="dot"></span>Live</span>`
        : `<span class="status">Add URL</span>`;
      const openText = hasUrl ? "Open →" : "Coming soon";

      return `
        <${wrapperTag} class="${className}"${href}>
          <div>
            <div class="card-top">
              <div class="icon">${escapeHTML(tool.icon)}</div>
              ${status}
            </div>
            <h2>${escapeHTML(tool.name)}</h2>
            <p class="description">${escapeHTML(tool.description)}</p>
          </div>
          <div class="card-bottom">
            <div class="tags">
              ${tool.tags.map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}
            </div>
            <span class="open">${openText}</span>
          </div>
        </${wrapperTag}>
      `;
    }

    function renderTools(query = "") {
      const normalized = query.trim().toLowerCase();

      const filtered = TOOLS.filter(tool => {
        const haystack = [tool.name, tool.description, ...(tool.tags || [])]
          .join(" ")
          .toLowerCase();
        return haystack.includes(normalized);
      });

      toolGrid.innerHTML = filtered.map(cardMarkup).join("");
      toolCount.textContent = `${filtered.length} ${filtered.length === 1 ? "tool" : "tools"}`;
      emptyState.style.display = filtered.length ? "none" : "block";
    }

    searchInput.addEventListener("input", event => renderTools(event.target.value));
    renderTools();
  </script>
</body>
</html>
